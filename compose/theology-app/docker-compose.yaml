services:
  theology-app:
    build: ../../apps/theology-app
    container_name: theology-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8002:8000"  # host-only; Caddy reaches it on the edge network
    volumes:
      - /srv/appdata/theology-app:/data
    networks:
      - default
      - edge

networks:
  edge:
    external: true
