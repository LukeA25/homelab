services:
  learning-app:
    build: ../../apps/learning-app
    container_name: learning-app
    restart: unless-stopped
    environment:
      LEARNING_DB: /data/learning.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOICE_ENGINE: ${VOICE_ENGINE:-live}
    ports:
      - "127.0.0.1:8009:8000"  # host-only; Caddy reaches it on the edge network
    volumes:
      - /srv/appdata/learning-app:/data
    networks:
      - default
      - edge

networks:
  edge:
    external: true
