services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    hostname: pihole
    ports:
      - "192.168.1.156:53:53/tcp"
      - "192.168.1.156:53:53/udp"
      - "100.101.135.109:53:53/tcp"
      - "100.101.135.109:53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "America/New_York"
      FTLCONF_webserver_api_password: "Andpih25!"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - /srv/appdata/pihole/etc-pihole:/etc/pihole
      - /srv/appdata/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
