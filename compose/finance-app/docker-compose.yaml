services:
  finance-app:
    build: ../../apps/finance-app
    container_name: finance-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"  # host-only; Caddy reaches it on the edge network
    volumes:
      - /srv/appdata/finance-app:/data
    networks:
      - default
      - edge

networks:
  edge:
    external: true
