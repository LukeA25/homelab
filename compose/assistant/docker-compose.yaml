# Nova gateway. Nova-critical: see AGENTS.md before restarting or rebuilding.
services:
  assistant:
    build: ../../apps/assistant
    container_name: assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DISPLAY_TZ: ${DISPLAY_TZ:-America/Chicago}
      TZ: ${DISPLAY_TZ:-America/Chicago}
      NOVA_DATA_DIR: /data
      HA_BASE_URL: ${HA_BASE_URL:-http://100.101.135.109:8123}
      # App ports are host-only; reach apps by container name on the edge network.
      # These override any older values in .env.
      HOMEWORK_BASE_URL: http://homework-app:8000
      DASHBOARD_BASE_URL: http://dashboard:8000
      WORKER_URL: http://agent-worker:8000
      OPS_URL: http://ops-runner:8000
    ports:
      # Host-only: clients use https://assistant.home.arpa through Caddy.
      - "127.0.0.1:8006:8000"
    volumes:
      # Context, devices, approvals, history and audit logs. Never inside the repo checkout.
      - /srv/appdata/nova:/data
    networks:
      - default
      - nova-internal
      - edge

networks:
  nova-internal:
    external: true
  edge:
    external: true
