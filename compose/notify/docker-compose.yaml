services:
  notify:
    build: ../../apps/notify
    container_name: notify
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${DISPLAY_TZ:-America/Chicago}
      NOTIFY_DB: /data/notify.db
      NOTIFY_VAPID: /data/vapid.json
    ports:
      - "127.0.0.1:8008:8000"  # host-only; Caddy reaches it on the edge network
    volumes:
      - /srv/appdata/notify:/data
    networks:
      - default
      - edge

networks:
  edge:
    external: true
