services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./private:/etc/caddy/private:ro
      - /srv/appdata/caddy/data:/data
      - /srv/appdata/caddy/config:/config
